<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Office</title><style>body{font-family:system-ui;margin:0;background:#111;color:#eee}header{padding:24px;border-bottom:1px solid #333}main{padding:24px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:1px solid #333;border-radius:14px;padding:18px;background:#181818}pre{white-space:pre-wrap;max-height:300px;overflow:auto}</style></head><body><header><strong>🏢 OFFICE OFFICE</strong><span style="float:right">Local-first agent orchestration</span></header><main><div id="status" class="card">Loading…</div><h2>Agents</h2><div class="grid"><div class="card">👔 Michael<br><small>Supervisor</small></div><div class="card">🛠 Dwight<br><small>Backend</small></div><div class="card">🎨 Pam<br><small>Frontend</small></div><div class="card">🧪 Jim<br><small>Testing</small></div></div><h2>Runs</h2><div id="runs"></div></main><script>async function load(){let s=await fetch('/api/status').then(r=>r.json());document.querySelector('#status').innerHTML='<b>Workspace</b><br>'+s.workspace+'<br><br><b>Git</b><pre>'+s.git+'</pre>';let runs=await fetch('/api/runs').then(r=>r.json());document.querySelector('#runs').innerHTML=runs.sort((a,b)=>b.id.localeCompare(a.id)).map(x=>'<div class="card"><b>'+x.status+'</b> — '+x.prompt+'<pre>'+JSON.stringify(x.tasks,null,2)+'</pre></div>').join('')||'<div class="card">No runs yet.</div>'}load();setInterval(load,3000)</script></body></html>
