name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # This repo intentionally has no committed lockfile; don't enable npm caching.
          package-manager-cache: false
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build

  review-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify review guidance
        run: |
          test -f docs/git-review.md
          test -f docs/safety.md
          grep -q "git diff" docs/git-review.md
          grep -q "git status" docs/git-review.md
