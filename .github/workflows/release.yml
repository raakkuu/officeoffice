name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
      - name: Publish to npm when a token is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm install
            npm run check
            npm test
            npm run build
            npm publish --access public --provenance
          else
            echo "NPM_TOKEN is not configured; skipping npm publication."
          fi
