<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Office Office dashboard visual preview</title><desc id="desc">Illustrative preview of the Office Office command center showing run statistics, a task composer, agent cards, and run history.</desc>
