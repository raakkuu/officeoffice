<rect x="105" y="330" width="290" height="105" rx="16" fill="#fffaf2"/><text x="250" y="367" fill="#8d2938" font-size="13" font-weight="700">DWIGHT</text><text x="250" y="395" fill="#28221f" font-size="21" font-weight="700">Backend + systems</text><text x="250" y="416" fill="#81776c" font-size="13">Implementation tasks</text>
<rect x="455" y="330" width="290" height="105" rx="16" fill="#fffaf2"/><text x="600" y="367" fill="#8d2938" font-size="13" font-weight="700">PAM</text><text x="600" y="395" fill="#28221f" font-size="21" font-weight="700">Frontend + UX</text><text x="600" y="416" fill="#81776c" font-size="13">Interface tasks</text>
<rect x="805" y="330" width="290" height="105" rx="16" fill="#fffaf2"/><text x="950" y="367" fill="#8d2938" font-size="13" font-weight="700">JIM</text><text x="950" y="395" fill="#28221f" font-size="21" font-weight="700">Testing + quality</text><text x="950" y="416" fill="#81776c" font-size="13">Verification tasks</text>
<rect x="290" y="510" width="620" height="82" rx="16" fill="#342a28" stroke="#c39a52" stroke-width="1.5"/><text x="600" y="543" fill="#e4bd7d" font-size="13" font-weight="700" letter-spacing="2">PERSIST + REVIEW</text><text x="600" y="571" fill="#fffaf2" font-size="22" font-weight="700">.hive/ · run history · supervisor review</text>
</g>
