<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Office Office — the AI team</title>
<desc id="desc">A friendly cartoon illustration of a manager agent planning a task and coordinating coder, designer, and research agents. Speech bubbles and shared notes illustrate the intended collaboration vision. A clear note distinguishes current handoff support from future autonomous conversations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#20204a"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86efac"/><stop offset="1" stop-color="#10b981"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#030712" flood-opacity=".28"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#a5b4fc"/></marker>
 <style>
 .white{font-family:ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.muted{font-family:ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}.title{font-size:36px;font-weight:850}.sub{font-size:18px}.name{font-size:21px;font-weight:800}.body{font-size:16px}.tiny{font-size:13px}.line{fill:none;stroke:#a5b4fc;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.bubble{fill:#fff;stroke:#dbeafe;stroke-width:2}.bubbleText{font-family:ui-sans-serif,system-ui,sans-serif;fill:#172554;font-size:16px;font-weight:650}.card{fill:#182338;stroke:#394967;stroke-width:2}
 </style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<circle cx="1090" cy="72" r="110" fill="#6366f1" opacity=".12"/><circle cx="90" cy="690" r="140" fill="#ec4899" opacity=".08"/>
<text x="48" y="58" class="white title">Meet your AI team 👋</text>
<text x="50" y="91" class="muted sub">One manager. Specialist teammates. A shared mission.</text>
