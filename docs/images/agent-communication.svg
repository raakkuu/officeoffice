<text x="478" y="456" text-anchor="middle" class="bubbleText">CODER BOT</text><text x="478" y="482" text-anchor="middle" class="muted" style="font-size:14px;fill:#1e40af">Builds features</text><text x="478" y="503" text-anchor="middle" class="muted" style="font-size:14px;fill:#1e40af">and fixes bugs</text>
<rect x="605" y="330" width="222" height="224" rx="20" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="2"/>
<circle cx="716" cy="390" r="42" fill="url(#purple)"/><rect x="687" y="373" width="58" height="39" rx="12" fill="#312e81" stroke="#fff" stroke-width="2"/><circle cx="704" cy="391" r="4" fill="#ddd6fe"/><circle cx="728" cy="391" r="4" fill="#ddd6fe"/><path d="M703 402 Q716 411 729 402" fill="none" stroke="#ddd6fe" stroke-width="3" stroke-linecap="round"/><path d="M716 346 V354 M676 374 L684 380 M756 374 L748 380" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
<text x="716" y="456" text-anchor="middle" class="bubbleText">DESIGN BOT</text><text x="716" y="482" text-anchor="middle" class="muted" style="font-size:14px;fill:#6b21a8">Shapes the UI</text><text x="716" y="503" text-anchor="middle" class="muted" style="font-size:14px;fill:#6b21a8">and user experience</text>
<rect x="843" y="330" width="222" height="224" rx="20" fill="#d1fae5" stroke="#6ee7b7" stroke-width="2"/>
