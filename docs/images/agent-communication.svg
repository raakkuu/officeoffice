<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Office Office agent collaboration</title>
<desc id="desc">A minimal dashboard-style map showing Michael coordinating three pixel-art specialist agents, with data handoffs flowing into a shared local project workspace.</desc>
<defs><style>
