<text x="199" y="444" text-anchor="middle" class="bubbleText">Michael plans the work</text><text x="199" y="465" text-anchor="middle" class="bubbleText">and assigns tasks</text>
<text x="88" y="514" class="muted" style="font-size:15px;fill:#4338ca;font-weight:700">✓ Breaks down the request</text><text x="88" y="540" class="muted" style="font-size:15px;fill:#4338ca;font-weight:700">✓ Tracks work and results</text>
<!-- task bubble -->
<path d="M367 173 h270 a15 15 0 0 1 15 15 v42 a15 15 0 0 1 -15 15 h-133 l-20 17 4-17 h-121 a15 15 0 0 1 -15-15 v-42 a15 15 0 0 1 15-15Z" class="bubble"/>
<text x="502" y="201" text-anchor="middle" class="bubbleText">“Build a website for my business!”</text><text x="502" y="224" text-anchor="middle" class="muted" style="font-size:13px;fill:#64748b">A single request becomes a plan</text>
<path d="M336 300 C380 300 390 300 420 300" class="line"/>
