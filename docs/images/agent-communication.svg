<text x="954" y="456" text-anchor="middle" class="bubbleText">RESEARCH BOT</text><text x="954" y="482" text-anchor="middle" class="muted" style="font-size:14px;fill:#047857">Finds answers</text><text x="954" y="503" text-anchor="middle" class="muted" style="font-size:14px;fill:#047857">and useful resources</text>
<!-- collaboration arrows -->
<path d="M590 365 H601" class="line"/><path d="M828 365 H839" class="line"/>
<rect x="403" y="564" width="626" height="25" rx="12" fill="#e0e7ff"/>
<text x="716" y="582" text-anchor="middle" style="font:700 13px system-ui;fill:#4338ca">SHARED HANDOFFS • NOTES • PROJECT KNOWLEDGE</text>
<!-- footer feature strip -->
<rect x="42" y="620" width="1116" height="91" rx="20" class="card"/>
<circle cx="84" cy="665" r="23" fill="#8b5cf6"/><path d="M73 662 Q84 648 95 662 Q84 677 73 662Z" fill="#fff"/><text x="120" y="655" class="white" style="font-size:18px;font-weight:800">Create teams • Share findings • Review results</text><text x="120" y="681" class="muted body">Local-first by design: your project context stays in your workspace.</text>
<rect x="794" y="642" width="335" height="46" rx="13" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/><text x="961" y="671" text-anchor="middle" class="white" style="font-size:16px;font-weight:800">Different agents. One mission.</text>
<text x="600" y="741" text-anchor="middle" class="muted tiny">Concept illustration • Autonomous agent-to-agent chat and AI-led meetings are still planned.</text>
</svg>